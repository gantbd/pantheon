[package]
name = "workbench-tui-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/workbench-tui"
publish = false
description = "Standalone interactive and headless application for Workbench terminal composition"

[[bin]]
name = "workbench-tui"
path = "src/main.rs"
doc = false

[dependencies]
workbench-tui = { version = "=0.1.0", path = ".." }
vellum-tui = { version = "=0.1.0", path = "../../vellum-tui" }
vellum-sdk-client = { version = "=0.1.0", path = "../../vellum/sdk/client" }
vellum-adapter-local-authentication = { version = "=0.1.0", path = "../../vellum/adapters/local-authentication" }
chronos-tui = { version = "=0.1.0", path = "../../chronos-tui" }
chronos-client = { version = "=0.1.0", path = "../../chronos/client/chronos-client" }
chronos-protocol = { version = "=0.1.0", path = "../../chronos/protocol/chronos-protocol" }
chronos-local = { version = "=0.1.0", path = "../../chronos/transport/chronos-local" }
agora-tui = { version = "=0.1.0", path = "../../agora-tui" }
agora-tui-local-client = { version = "=0.1.0", path = "../../agora-tui/local-client" }
agora-client = { version = "=0.1.0", path = "../../agora/client/agora-client" }
agora-protocol = { version = "=0.1.0", path = "../../agora/protocol/agora-protocol" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
agora-wire = { version = "=0.1.0", path = "../../agora/protocol/agora-wire" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
