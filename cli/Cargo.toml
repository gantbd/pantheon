[package]
name = "pantheon-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/pantheon"
publish = false
description = "Standalone interactive and headless application for Pantheon terminal composition"

[features]
default = ["native-chronos"]
native-chronos = ["dep:chronos-standalone"]

[[bin]]
name = "pantheon"
path = "src/main.rs"
doc = false

[dependencies]
pantheon = { version = "=0.1.0", path = ".." }
vellum-tui = { version = "=0.1.0", path = "../../vellum-tui" }
vellum-sdk-client = { version = "=0.1.0", path = "../../vellum/sdk/client" }
vellum-adapter-local-authentication = { version = "=0.1.0", path = "../../vellum/adapters/local-authentication" }
vellum-adapter-local-fs = { version = "=0.1.0", path = "../../vellum/adapters/local-fs" }
vellum-daemon = { version = "=0.1.0", path = "../../vellum/applications/vellum-daemon" }
vellum-host = { version = "=0.1.0", path = "../../vellum/host/vellum-host" }
vellum-workspace = { version = "=0.1.0", path = "../../vellum/host/vellum-workspace" }
chronos-tui = { version = "=0.1.0", path = "../../chronos-tui" }
chronos-client = { version = "=0.1.0", path = "../../chronos/client/chronos-client" }
chronos-protocol = { version = "=0.1.0", path = "../../chronos/protocol/chronos-protocol" }
chronos-local = { version = "=0.1.0", path = "../../chronos/transport/chronos-local" }
chronos-standalone = { version = "=0.1.0", path = "../../chronos/applications/chronos-daemon", optional = true }
agora-tui = { version = "=0.1.0", path = "../../agora-tui" }
agora-local-client = { version = "=0.1.0", path = "../../agora/client/agora-local-client" }
agora-client = { version = "=0.1.0", path = "../../agora/client/agora-client" }
agora-protocol = { version = "=0.1.0", path = "../../agora/protocol/agora-protocol" }
moira-tui = { version = "=0.1.0", path = "../../moira-tui" }
moira-tui-local-client = { version = "=0.1.0", path = "../../moira-tui/local-client" }
moira-client = { version = "=0.1.0", path = "../../moira/crates/moira-client", features = ["unix"] }
moira-protocol = { version = "=0.1.0", path = "../../moira/crates/moira-protocol" }
moira-reconciliation-command = { version = "=0.1.0", path = "../../moira/crates/moira-reconciliation-command" }
daimon-tui = { version = "=0.1.0", path = "../../daimon-tui" }
daimon-agent-command = { version = "=0.1.0", path = "../../daimon/crates/daimon-agent-command" }
daimon-client = { version = "=0.1.0", path = "../../daimon/crates/daimon-client", features = ["unix"] }
daimon-protocol = { version = "=0.1.0", path = "../../daimon/crates/daimon-protocol" }
daimon-wire = { version = "=0.1.0", path = "../../daimon/crates/daimon-wire" }
hermes-tui = { version = "=0.1.0", path = "../../hermes-tui" }
hermes-consumer-command = { version = "=0.1.0", path = "../../hermes/crates/hermes-consumer-command" }
hermes-disclosure-command = { version = "=0.1.0", path = "../../hermes/crates/hermes-disclosure-command" }
hermes-operator-command = { version = "=0.1.0", path = "../../hermes/crates/hermes-operator-command" }
hermes-local-client = { version = "=0.1.0", path = "../../hermes/crates/hermes-local-client" }
hermes-client = { version = "=0.1.0", path = "../../hermes/crates/hermes-client" }
hermes-protocol = { version = "=0.1.0", path = "../../hermes/crates/hermes-protocol" }
aegis-tui = { version = "=0.1.0", path = "../../aegis-tui" }
aegis-admin-command = { version = "=0.1.0", path = "../../aegis/crates/aegis-admin-command" }
aegis-admin-session = { version = "=0.1.0", path = "../../aegis/applications/aegis-admin-session" }
aegis-local-client = { version = "=0.1.0", path = "../../aegis/crates/aegis-local-client" }
aegis-client = { version = "=0.1.0", path = "../../aegis/crates/aegis-client" }
aegis-wire = { version = "=0.1.0", path = "../../aegis/crates/aegis-wire" }
tellus = { version = "=0.1.0", path = "../../tellus" }
tellus-local-client = { version = "=0.1.0", path = "../../tellus/local-client" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
nix = { version = "=0.29.0", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
agora-wire = { version = "=0.1.0", path = "../../agora/protocol/agora-wire" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
