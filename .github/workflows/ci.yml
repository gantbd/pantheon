name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out Pantheon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: pantheon, persist-credentials: false }
      - name: Check out Keystone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/keystone, ref: 2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4, path: keystone, persist-credentials: false }
      - name: Check out Aegis
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/aegis, ref: 0446e4fcf7412be9e0313523235d4e674d2fdd94, path: aegis, persist-credentials: false }
      - name: Check out Aegis TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/aegis-tui, ref: 3433dd2f306a1c9b8af4276b88d89c546eab2d30, path: aegis-tui, persist-credentials: false }
      - name: Check out Agora
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/agora, ref: 9ab9e0f2c467c3b6501e08c44f10f679b8ed6cd8, path: agora, persist-credentials: false }
      - name: Check out Agora TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/agora-tui, ref: 36c6c624360de88ee24c0c9035d5ad36bb62e9a5, path: agora-tui, persist-credentials: false }
      - name: Check out Chronos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/chronos, ref: 43fdf6f33fa526899639f03cc32e398bcea86010, path: chronos, persist-credentials: false }
      - name: Check out Chronos TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/chronos-tui, ref: 52b7a664ed1caf89eea0c94a7a3a480aa721455d, path: chronos-tui, persist-credentials: false }
      - name: Check out Daimon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/daimon, ref: 51b4dcb00480f017adca2e324daf6f6c96c21efb, path: daimon, persist-credentials: false }
      - name: Check out Daimon TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/daimon-tui, ref: c6888396d2c044c290c6f688cb5c1f613464f0cc, path: daimon-tui, persist-credentials: false }
      - name: Check out Hermes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/hermes, ref: e666416071d1b5b6f4bdb7669a3984ef6d8a3162, path: hermes, persist-credentials: false }
      - name: Check out Hermes TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/hermes-tui, ref: 431f6b565b34398c76894f68a443c01b5ae7f9d1, path: hermes-tui, persist-credentials: false }
      - name: Check out Moira
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/moira, ref: 23f32236b0d1b43138835df3813271b1bacd58f2, path: moira, persist-credentials: false }
      - name: Check out Moira TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/moira-tui, ref: 2b43c913a93960ee02b4b70dcdb7d6d4c495513f, path: moira-tui, persist-credentials: false }
      - name: Check out Tellus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/tellus, ref: 209b15077680ee19f9f20a3620f4b92343ca5e60, path: tellus, persist-credentials: false }
      - name: Check out Vellum
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/vellum, ref: 81881c01517af77e3bdc25d7998e74bb4087e882, path: vellum, persist-credentials: false }
      - name: Check out Vellum TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/vellum-tui, ref: 3b4b2bb5eea86b0bf1a0a95b98d59ab77a51398c, path: vellum-tui, persist-credentials: false }
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Fetch locked dependencies
        working-directory: pantheon
        run: cargo fetch --locked
      - name: Audit current RustSec advisories
        working-directory: pantheon
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace
        working-directory: pantheon
        run: make check
