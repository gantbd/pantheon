name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out Pantheon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { path: pantheon, persist-credentials: false }
      - name: Check out Keystone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/keystone, ref: 2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4, path: keystone, persist-credentials: false }
      - name: Check out Aegis
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/aegis, ref: 0446e4fcf7412be9e0313523235d4e674d2fdd94, path: aegis, persist-credentials: false }
      - name: Check out Aegis TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/aegis-tui, ref: 258065605c86ebccf375aea47521a858f8f723b1, path: aegis-tui, persist-credentials: false }
      - name: Check out Agora
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/agora, ref: 45b11bcd1e9b7b21e79faf8f1794f8379622f635, path: agora, persist-credentials: false }
      - name: Check out Agora TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/agora-tui, ref: 63689c5397e6a0b84879692b05436693390838cb, path: agora-tui, persist-credentials: false }
      - name: Check out Chronos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/chronos, ref: 26366ec9172b48280d9bba3688572edf1c0d2719, path: chronos, persist-credentials: false }
      - name: Check out Chronos TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/chronos-tui, ref: 7cbe44618afcefae52d326a3a83027c46fb2c3ac, path: chronos-tui, persist-credentials: false }
      - name: Check out Daimon
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/daimon, ref: ca358a46e7b18b0b93599d0e7cc1bfdff36e3636, path: daimon, persist-credentials: false }
      - name: Check out Daimon TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/daimon-tui, ref: b63705bddd4f4778de13a2c2824717ca8d76edd1, path: daimon-tui, persist-credentials: false }
      - name: Check out Hermes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/hermes, ref: e666416071d1b5b6f4bdb7669a3984ef6d8a3162, path: hermes, persist-credentials: false }
      - name: Check out Hermes TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/hermes-tui, ref: 27f857df701edf6261f09cf38d74f1a48ba0cb7e, path: hermes-tui, persist-credentials: false }
      - name: Check out Moira
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/moira, ref: 23f32236b0d1b43138835df3813271b1bacd58f2, path: moira, persist-credentials: false }
      - name: Check out Moira TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/moira-tui, ref: 3237746050b0160b8a4200482a6e4caf0fea9191, path: moira-tui, persist-credentials: false }
      - name: Check out Tellus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/tellus, ref: 03a920e9b1457ae33428acb9672c5fd320c69e72, path: tellus, persist-credentials: false }
      - name: Check out Vellum
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/vellum, ref: 898affc1860869ab7fd4d4de369ca3556bc12aaf, path: vellum, persist-credentials: false }
      - name: Check out Vellum TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { repository: gantbd/vellum-tui, ref: 1bd09e171cd679eae479715f6203ef5d0b8a5d50, path: vellum-tui, persist-credentials: false }
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Fetch locked dependencies
        working-directory: pantheon
        run: cargo fetch --locked
      - name: Audit current RustSec advisories
        working-directory: pantheon
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace
        working-directory: pantheon
        run: make check
