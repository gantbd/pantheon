[package]
name = "workbench-agora-host-qualification"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
pantheon-cli = { path = "../../cli" }
pantheon = { path = "../.." }
chronos-tui = { path = "../../../chronos-tui" }
agora-tui = { path = "../../../agora-tui" }
agora-client = { path = "../../../agora/client/agora-client" }
agora-local-client = { path = "../../../agora/client/agora-local-client" }
agora-protocol = { path = "../../../agora/protocol/agora-protocol" }
agora-scheduled-publication-port = { path = "../../../agora/ports/agora-scheduled-publication-port" }
agora-wire = { path = "../../../agora/protocol/agora-wire" }
agora-aegis-verifier = { path = "../../../agora/adapters/agora-aegis-verifier" }
agora-engine = { path = "../../../agora/engine/agora-engine" }
agora-host = { path = "../../../agora/host/agora-host" }
agora-local-daemon = { path = "../../../agora/applications/agora-local-daemon" }
agora-service = { path = "../../../agora/service/agora-service" }
aegis-client = { path = "../../../aegis/crates/aegis-client" }
aegis-protocol = { path = "../../../aegis/crates/aegis-protocol" }
ratatui = { version = "=0.30.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
