[workspace]
members = [".", "cli"]
exclude = ["qualification/agora-host"]
resolver = "3"

[package]
name = "workbench-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/workbench-tui"
readme = "README.md"
publish = false
description = "Terminal presentation host for independent workspace peers"

[dependencies]
vellum-tui = { version = "=0.1.0", path = "../vellum-tui" }
vellum-sdk-client = { version = "=0.1.0", path = "../vellum/sdk/client" }
chronos-tui = { version = "=0.1.0", path = "../chronos-tui" }
agora-tui = { version = "=0.1.0", path = "../agora-tui" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
agora-client = { version = "=0.1.0", path = "../agora/client/agora-client" }
agora-protocol = { version = "=0.1.0", path = "../agora/protocol/agora-protocol" }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
